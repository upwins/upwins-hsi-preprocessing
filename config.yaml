# ==========================================================================
# Configuration for the UPWINS hyperspectral preprocessing project.
# Edit paths/parameters here rather than in the notebooks. Paths are relative
# to the repo root; the notebooks resolve them from there (so Jupyter can be
# launched from either the repo root or the notebooks/ folder). A small
# calibration set ships under examples/calibration/ so notebooks 02-03
# reproduce from a clone.
# ==========================================================================

paths:
  # ------------------------------------------------------------------------
  # ENVI image cubes are given as a pair: the image file and its header. Raw
  # cubes from the sensor have no extension on the image file; reflectance
  # products written by spectral.envi.save_image get .img. Naming both files
  # explicitly keeps each case literal instead of guessed. Both entries of a
  # pair must name the same cube (the notebooks assert this).
  # ------------------------------------------------------------------------

  # --- Notebook 01: raw image containing the cal panels ---
  cal_image:             examples/sample/raw_0_or
  cal_image_hdr:         examples/sample/raw_0_or.hdr

  # --- Notebook 02: raw image to convert to reflectance ---
  raw_image:             examples/sample/raw_34850_or
  raw_image_hdr:         examples/sample/raw_34850_or.hdr

  # --- Notebooks 02/03: reflectance image to view / draw training ROIs on ---
  # Leave BOTH blank to use the default convention: notebook 02's output for the
  # raw image above, i.e. <raw_image>_ref.img and <raw_image>_ref.hdr (for the
  # shipped example that is examples/sample/raw_34850_or_ref.*). Notebook 02
  # always views its own freshly-written _ref output regardless of these keys;
  # notebook 03 reads them as its input and falls back to the same default when
  # they are blank. Set them only to point notebook 03 at a reflectance image
  # that was NOT produced from raw_image (e.g. one supplied separately) --
  # notebook 03 warns if a set value disagrees with the default. When set, both
  # entries of the pair must name the same cube.
  reflectance_image:
  reflectance_image_hdr:

  # ------------------------------------------------------------------------
  # Calibration inputs: shipped, committed, read-only reference the fit needs.
  # (cal_tarp_spectra is the tarps' known reflectance -- the same across
  # collections; CalPanels.pkl is the cal-panel ROIs for the cal image above.)
  # ------------------------------------------------------------------------
  cal_library_sli: examples/calibration/cal_tarp_spectra.sli
  cal_library_hdr: examples/calibration/cal_tarp_spectra.hdr
  cal_panel_rois:  examples/calibration/CalPanels.pkl   # saved cal-panel ROIs

  # ------------------------------------------------------------------------
  # Calibration bundle for THIS collection. Notebook 01 writes gain.npy,
  # offset.npy and the panel_*_spectra.npy intermediates INTO this directory;
  # notebook 02 and the batch script read gain.npy/offset.npy FROM it. Point it
  # at a per-collection directory under data/ (gitignored) so each collection
  # keeps its own coefficients and a re-run never clobbers another collection's.
  calibration_dir: data/calibration/example

  # Shipped seed calibration (committed, read-only). When calibration_dir has no
  # gain/offset yet -- e.g. a fresh clone, before notebook 01 has been run --
  # notebook 02 and the batch script fall back to this set and say so, so the
  # repo still runs from a clone. Run notebook 01 for a real collection to write
  # its own coefficients into calibration_dir above.
  calibration_seed_dir: examples/calibration

reflectance:
  smoothing_level: 2                    # spatial-smoothing iterations
  bbl_wl_ranges: [[0, 425], [750, 770], [900, 2500]]   # bad-band wl ranges (nm) to drop

batch:
  # For scripts/batch_convert_reflectance.py: convert every image in this
  # directory whose file name ends with `ends_with`. input_dir is a path
  # (resolved against the repo root); ends_with is a filename suffix, not a path.
  input_dir: examples/sample
  ends_with: _or
