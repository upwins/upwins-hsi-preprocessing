# ==========================================================================
# Configuration for the UPWINS hyperspectral preprocessing project.
# Edit paths/parameters here rather than in the notebooks. Paths are relative
# to the repo root; the notebooks resolve them from there (so Jupyter can be
# launched from either the repo root or the notebooks/ folder).
#
# No imagery or calibration ships in this repo -- you supply it. The paths
# below are placeholders pointing under data/ (gitignored); edit them for your
# collection, or point them at wherever you keep your data.
# ==========================================================================

paths:
  # ------------------------------------------------------------------------
  # Root directory for this data collection. By convention every other path
  # below lives under it, and it is where the notebooks' ROI save/load dialogs
  # open by default (notebook 03). YAML has no variable substitution, so the
  # paths below spell the directory out in full -- if you change this, change
  # them too.
  # ------------------------------------------------------------------------
  collection_dir:        data/my_collection

  # ------------------------------------------------------------------------
  # ENVI image cubes are given as a pair: the image file and its header. Both
  # entries of a pair must name the same cube (the notebooks assert this).
  # ------------------------------------------------------------------------

  # --- Notebook 01: raw image containing the cal panels ---
  cal_image:             data/my_collection/raw_0_or
  cal_image_hdr:         data/my_collection/raw_0_or.hdr

  # --- Notebook 02: raw image to convert to reflectance ---
  # The data file may be extensionless or carry .img/.bin/.dat/.raw, and its
  # header may be named either <file>.hdr or <base>.hdr -- both conventions are
  # accepted. A known data extension is dropped before the _ref product is
  # named, so raw_36286.bin converts to raw_36286_ref.img, not
  # raw_36286.bin_ref.img.
  raw_image:             data/my_collection/raw_34850_or
  raw_image_hdr:         data/my_collection/raw_34850_or.hdr

  # --- Notebooks 02/03: reflectance image to view / draw training ROIs on ---
  # Leave BOTH blank (the common case) to use notebook 02's output for raw_image,
  # <raw_image without its data extension>_ref.img/.hdr. Set them only to point
  # notebook 03 at a reflectance image not produced from raw_image; nb 03 warns
  # if a set value disagrees with that default.
  reflectance_image:
  reflectance_image_hdr:

  # ------------------------------------------------------------------------
  # Calibration fit inputs for notebook 01 (you supply these):
  #   cal_library_* -- the tarps' known reflectance (ASD-measured library).
  #   cal_panel_rois -- the cal-panel ROIs drawn on cal_image above.
  # DRAW FRESH cal-panel ROIs for EACH data collection: CalPanels.pkl stores
  # measured DN, not a reusable region, so reusing another collection's pickle
  # silently re-fits that collection's tarps.
  # ------------------------------------------------------------------------
  cal_library_sli: data/my_collection/cal_tarp_spectra.sli
  cal_library_hdr: data/my_collection/cal_tarp_spectra.hdr
  cal_panel_rois:  data/my_collection/CalPanels.pkl   # saved cal-panel ROIs

  # ------------------------------------------------------------------------
  # Per-collection calibration bundle. Notebook 01 writes gain.npy/offset.npy
  # (and the panel_*_spectra.npy intermediates) here; notebook 02 and the batch
  # script read gain/offset back from here. One directory per collection.
  # ------------------------------------------------------------------------
  calibration_dir: data/my_collection/calibration

reflectance:
  smoothing_level: 2                    # spatial-smoothing iterations
  bbl_wl_ranges: [[0, 425], [750, 770], [900, 2500]]   # bad-band wl ranges (nm) to drop

batch:
  # For scripts/batch_convert_reflectance.py: convert every image in this
  # directory whose file name ends with `ends_with`. input_dir is a path
  # (resolved against the repo root); ends_with is a filename suffix, not a path.
  input_dir: data/my_collection
  ends_with: _or
